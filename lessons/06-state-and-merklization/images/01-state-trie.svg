<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
<style>
  text { fill: #3c3c43; text-anchor: middle; }
  .note { fill: #67676c; font-size: 12px; }
  .key { fill: #67676c; font-size: 13px; }
  .path { fill: #d14d1e; font-weight: bold; }
  .bit { fill: #5b8def; font-weight: bold; }
  .edge { stroke: #9a9aa0; stroke-width: 1.5; }
  .branch { fill: #e8f0fe; stroke: #5b8def; stroke-width: 1.5; }
  .leaf { fill: #e6f6ef; stroke: #3fa97a; stroke-width: 1.5; }
  @media (prefers-color-scheme: dark) {
    text { fill: #dfdfd6; }
    .note, .key { fill: #a8a8a0; }
    .path { fill: #ff8c5a; }
    .bit { fill: #7aa2f7; }
    .edge { stroke: #6b6b72; }
    .branch { fill: #1e2a44; stroke: #7aa2f7; }
    .leaf { fill: #1b3329; stroke: #4fc08d; }
  }
</style>
<line class="edge" x1="395" y1="96" x2="235" y2="140"/><text class="bit" x="301" y="122">0</text>
<line class="edge" x1="395" y1="96" x2="555" y2="140"/><text class="bit" x="489" y="122">1</text>
<line class="edge" x1="235" y1="206" x2="145" y2="250"/><text class="bit" x="176" y="232">0</text>
<line class="edge" x1="235" y1="206" x2="355" y2="250"/><text class="bit" x="309" y="232">1</text>
<rect class="branch" x="330" y="30" width="130" height="40" rx="6"/>
<text x="395" y="55">branch</text>
<text class="note" x="395" y="88">the root: H(this node)</text>
<rect class="branch" x="170" y="140" width="130" height="40" rx="6"/>
<text x="235" y="165">branch</text>
<text class="note" x="235" y="198">64 bytes: both sides' hashes</text>
<rect class="leaf" x="490" y="140" width="130" height="40" rx="6"/>
<text x="555" y="157">leaf</text>
<text class="key" x="555" y="173"><tspan class="path">1</tspan>111 1111</text>
<text class="note" x="555" y="198">0xff…: alone on the 1 side</text>
<rect class="leaf" x="80" y="250" width="130" height="40" rx="6"/>
<text x="145" y="267">leaf</text>
<text class="key" x="145" y="283"><tspan class="path">00</tspan>00 0001</text>
<text class="note" x="145" y="308">0x01…</text>
<rect class="leaf" x="290" y="250" width="130" height="40" rx="6"/>
<text x="355" y="267">leaf</text>
<text class="key" x="355" y="283"><tspan class="path">01</tspan>00 0000</text>
<text class="note" x="355" y="308">0x40…</text>
</svg>
